<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Sothik IT | Koha Editor Login</title>
    <link href="https://fonts.googleapis.com/css2?family=Dosis:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Dosis', sans-serif; background-color: #F7F6F2; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-card { background: white; padding: 40px; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 350px; text-align: center; border-top: 5px solid #C026D3; }
        h1 { color: #C026D3; margin-top: 0; margin-bottom: 30px; }
        input { width: 100%; padding: 12px; margin-bottom: 20px; border: 1px solid #ddd; border-radius: 6px; box-sizing: border-box; font-family: inherit; font-size: 1rem; }
        input:focus { border-color: #C026D3; outline: none; }
        button { width: 100%; padding: 12px; background: #C026D3; color: white; border: none; border-radius: 6px; font-size: 1.1rem; font-weight: 600; cursor: pointer; transition: background 0.2s; }
        button:hover { background: #a21db3; }
        .error { color: #ef4444; background: #fee2e2; padding: 10px; border-radius: 6px; margin-bottom: 20px; font-weight: 600; }
    </style>
</head>
<body>
    <div class="login-card">
        <h1>Workstation Login</h1>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/koha_editor/login">
            <input type="text" name="username" placeholder="Koha Username" required>
            <input type="password" name="password" placeholder="Koha Password" required>
            <button type="submit">Authenticate</button>
        </form>
    </div>
</body>
</html>
